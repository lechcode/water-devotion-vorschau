<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@font-face{font-family:'Playfair Display';src:url(../assets/fonts/playfair-display-400.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;src:url(../assets/fonts/playfair-display-400italic.woff2) format('woff2')}
@font-face{font-family:'Outfit';src:url(../assets/fonts/outfit-400.woff2) format('woff2')}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Outfit,sans-serif}
img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:65% 40%}
.scrim{position:absolute;inset:0;background:linear-gradient(14deg, rgba(36,73,76,.92) 0%, rgba(36,73,76,.55) 45%, rgba(36,73,76,.06) 75%)}
.text{position:absolute;left:70px;bottom:64px;color:#fff}
.eyebrow{letter-spacing:.24em;text-transform:uppercase;font-size:22px;color:#CFE8E6;margin-bottom:18px}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:76px;line-height:1.05}
h1 em{color:#CFE8E6}
.sub{font-size:26px;margin-top:18px;color:#EAF4F3}
</style></head><body>
<img class="bg" src="../assets/img/hero-water-1600.jpg">
<div class="scrim"></div>
<div class="text">
  <div class="eyebrow">The Water Devotion · Lucerne</div>
  <h1>The art of becoming <em>fluid</em></h1>
  <div class="sub">Fluid dance · 1:1 mentoring · Workshops · ZenThai Shiatsu</div>
</div>
</body></html>
